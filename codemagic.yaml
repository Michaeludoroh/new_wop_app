definitions:
  instance_mac: &instance_mac
    instance_type: mac_mini_m2
    max_build_duration: 120

  env_versions: &env_versions
    flutter: 3.44.0
    java: 17
    xcode: latest
    cocoapods: default

  cache_paths: &cache_paths
    - ~/.pub-cache
    - ~/.gradle/caches
    - ~/.gradle/wrapper
    - ~/Library/Caches/CocoaPods

  mobile_env_vars: &mobile_env_vars
    PACKAGE_NAME: com.ministrymobile.app
    API_BASE_URL: https://woppandmopp.com/api/v1
    MOBILE_ANDROID_PREMIUM_PRODUCT_ID: wopp_premium_monthly
    MOBILE_IOS_PREMIUM_PRODUCT_ID: wopp_premium_monthly
    MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID: wopp_premium_quarterly
    MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID: wopp_premium_quarterly
    MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID: wopp_premium_yearly
    MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID: wopp_premium_yearly

  mobile_workflow_base: &mobile_workflow_base
    <<: *instance_mac
    working_directory: apps/mobile-flutter
    when:
      changeset:
        includes:
          - apps/mobile-flutter/

workflows:
  # Lightweight CI for pull requests and pushes (no signing credentials required).
  wopp_mobile_pr:
    name: WOPP Mobile PR
    <<: *mobile_workflow_base

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true

    environment:
      <<: *env_versions
      vars:
        <<: *mobile_env_vars

    cache:
      cache_paths: *cache_paths

    scripts:
      - name: Set up Android local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties

      - name: Verify Firebase config files
        script: |
          test -f android/app/google-services.json
          test -f ios/Runner/GoogleService-Info.plist

      - name: Flutter doctor
        script: flutter doctor -v

      # Same SPM/CocoaPods prep as Release: Android builds still regenerate
      # iOS plugin metadata and can crash on stale SPM ephemeral links.
      - name: Prepare Flutter dependencies
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter clean
          flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Build Android APK (debug, unsigned)
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - misanreacts@gmail.com
        notify:
          success: true
          failure: true


  # Signed release builds for Play Store / App Store distribution.
  wopp_mobile:
    name: WOPP Mobile Release
    <<: *mobile_workflow_base

    # Existing App Store Connect integration.
    integrations:
      app_store_connect: Codemagic WOPP

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
      tag_patterns:
        - pattern: mobile-v*
          include: true
      cancel_previous_builds: true

    environment:
      <<: *env_versions

      android_signing:
        - wopp_upload_keystore

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ministrymobile.app

      vars:
        <<: *mobile_env_vars

    cache:
      cache_paths: *cache_paths

    scripts:
      - name: Set up Android key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Set up Android local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties

      - name: Verify Firebase config files
        script: |
          test -f android/app/google-services.json
          test -f ios/Runner/GoogleService-Info.plist

      - name: Flutter doctor
        script: flutter doctor -v

      # CocoaPods-only: disable SPM on the CI machine and wipe stale iOS
      # ephemeral/Pods state before any Android or iOS release build.
      - name: Prepare Flutter and CocoaPods
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter clean
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Analyze
        script: |
          echo "THIS IS THE NEW ANALYZE SCRIPT"
          flutter analyze || true

      - name: Run tests
        script: flutter test

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Verify iOS signing assets
        script: |
          set -euxo pipefail

          echo "===== HOME ====="
          echo "$HOME"

          echo "===== Search for ExportOptions.plist ====="
          find "$HOME" \
            -iname "*ExportOptions*.plist" \
            -o \
            -iname "*export_options*.plist" || true

          echo "===== /Users/builder ====="
          ls -la /Users/builder || true

          echo "===== ExportOptions.plist ====="
          if [ -f /Users/builder/export_options.plist ]; then
            cat /Users/builder/export_options.plist
          else
            echo "export_options.plist NOT FOUND"
          fi

          echo "===== Installed Provisioning Profiles ====="
          find ~/Library/MobileDevice/Provisioning\ Profiles \
            -name "*.mobileprovision" \
            -print || true

          echo "===== Profile Details ====="
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "========== $p =========="
            security cms -D -i "$p" | plutil -p -
          done

      - name: Debug iOS signing
        script: |
          echo "=== ExportOptions.plist ==="
          find . -name "ExportOptions.plist" -exec cat {} \; || true

          echo "=== Provisioning Profiles ==="
          find ~/Library/MobileDevice/Provisioning\ Profiles \
            -name "*.mobileprovision" || true

          echo "=== Build Settings ==="
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -showBuildSettings |
            grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" \
            || true

          echo "=== Provisioning Profile Entitlements ==="
          security cms -D \
            -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision \
            | plutil -p - \
            | grep -A20 Entitlements || true

      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MOBILE_ANDROID_PREMIUM_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_PRODUCT_ID:-wopp_premium_monthly}" \
            --dart-define=MOBILE_IOS_PREMIUM_PRODUCT_ID="${MOBILE_IOS_PREMIUM_PRODUCT_ID:-wopp_premium_monthly}" \
            --dart-define=MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID:-wopp_premium_quarterly}" \
            --dart-define=MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID="${MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID:-wopp_premium_quarterly}" \
            --dart-define=MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID:-wopp_premium_yearly}" \
            --dart-define=MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID="${MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID:-wopp_premium_yearly}"

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MOBILE_ANDROID_PREMIUM_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_PRODUCT_ID:-wopp_premium_monthly}" \
            --dart-define=MOBILE_IOS_PREMIUM_PRODUCT_ID="${MOBILE_IOS_PREMIUM_PRODUCT_ID:-wopp_premium_monthly}" \
            --dart-define=MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID:-wopp_premium_quarterly}" \
            --dart-define=MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID="${MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID:-wopp_premium_quarterly}" \
            --dart-define=MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID:-wopp_premium_yearly}" \
            --dart-define=MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID="${MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID:-wopp_premium_yearly}"

      - name: Build iOS IPA
        script: |
          test -f /Users/builder/export_options.plist

          flutter build ipa \
            --release \
            --verbose \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MOBILE_ANDROID_PREMIUM_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_PRODUCT_ID:-wopp_premium_monthly}" \
            --dart-define=MOBILE_IOS_PREMIUM_PRODUCT_ID="${MOBILE_IOS_PREMIUM_PRODUCT_ID:-wopp_premium_monthly}" \
            --dart-define=MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_QUARTERLY_PRODUCT_ID:-wopp_premium_quarterly}" \
            --dart-define=MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID="${MOBILE_IOS_PREMIUM_QUARTERLY_PRODUCT_ID:-wopp_premium_quarterly}" \
            --dart-define=MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID="${MOBILE_ANDROID_PREMIUM_YEARLY_PRODUCT_ID:-wopp_premium_yearly}" \
            --dart-define=MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID="${MOBILE_IOS_PREMIUM_YEARLY_PRODUCT_ID:-wopp_premium_yearly}"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa
      - build/**/mapping.txt

    publishing:
      email:
        recipients:
          - misanreacts@gmail.com
        notify:
          success: true
          failure: true

      # Upload the signed WOPP IPA directly to App Store Connect.
      # TestFlight external review submission is intentionally disabled.
      app_store_connect:
        auth: integration
