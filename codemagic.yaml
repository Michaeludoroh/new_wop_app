definitions:
  instance_mac: &instance_mac
    instance_type: mac_mini_m2
    max_build_duration: 120

  env_versions: &env_versions
    flutter: 3.44.0
    java: 17
    xcode: latest
    cocoapods: default

  cache_paths: &cache_paths
    - ~/.pub-cache
    - ~/.gradle/caches
    - ~/.gradle/wrapper
    - ~/Library/Caches/CocoaPods

  mobile_env_vars: &mobile_env_vars
    PACKAGE_NAME: com.ministrymobile.app
    API_BASE_URL: https://woppandmopp.com/api/v1
    MOBILE_ANDROID_PREMIUM_PRODUCT_ID: wopp_premium_monthly
    MOBILE_IOS_PREMIUM_PRODUCT_ID: wopp_premium_monthly

  mobile_workflow_base: &mobile_workflow_base
    <<: *instance_mac
    working_directory: apps/mobile-flutter
    when:
      changeset:
        includes:
          - apps/mobile-flutter/

workflows:
  # Lightweight CI for pull requests and pushes (no signing credentials required).
  wopp_mobile_pr:
    name: WOPP Mobile PR
    <<: *mobile_workflow_base

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true

    environment:
      <<: *env_versions
      vars:
        <<: *mobile_env_vars

    cache:
      cache_paths: *cache_paths

    scripts:
      - name: Set up Android local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties

      - name: Verify Firebase config files
        script: |
          test -f android/app/google-services.json
          test -f ios/Runner/GoogleService-Info.plist

      - name: Flutter doctor
        script: flutter doctor -v

      - name: Clean
        script: flutter clean

      - name: Install dependencies
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Build Android APK (debug, unsigned)
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - misanreacts@gmail.com
        notify:
          success: true
          failure: true

  # Signed release builds for Play Store / TestFlight distribution.
  wopp_mobile:
    name: WOPP Mobile Release
    <<: *mobile_workflow_base

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
      tag_patterns:
        - pattern: mobile-v*
          include: true
      cancel_previous_builds: true

    environment:
      <<: *env_versions
      android_signing:
        - wopp_upload_keystore
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ministrymobile.app
      vars:
        <<: *mobile_env_vars

    cache:
      cache_paths: *cache_paths

    scripts:
      - name: Set up Android key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Set up Android local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > android/local.properties

      - name: Verify Firebase config files
        script: |
          test -f android/app/google-services.json
          test -f ios/Runner/GoogleService-Info.plist

      - name: Flutter doctor
        script: flutter doctor -v

      - name: Clean
        script: flutter clean

      - name: Install dependencies
        script: flutter pub get

      - name: Analyze
        script: |
          flutter analyze || true

      - name: Run tests
        script: flutter test

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MOBILE_ANDROID_PREMIUM_PRODUCT_ID="$MOBILE_ANDROID_PREMIUM_PRODUCT_ID" \
            --dart-define=MOBILE_IOS_PREMIUM_PRODUCT_ID="$MOBILE_IOS_PREMIUM_PRODUCT_ID"

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MOBILE_ANDROID_PREMIUM_PRODUCT_ID="$MOBILE_ANDROID_PREMIUM_PRODUCT_ID" \
            --dart-define=MOBILE_IOS_PREMIUM_PRODUCT_ID="$MOBILE_IOS_PREMIUM_PRODUCT_ID"

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=MOBILE_ANDROID_PREMIUM_PRODUCT_ID="$MOBILE_ANDROID_PREMIUM_PRODUCT_ID" \
            --dart-define=MOBILE_IOS_PREMIUM_PRODUCT_ID="$MOBILE_IOS_PREMIUM_PRODUCT_ID" \
  

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa
      - build/**/mapping.txt

    publishing:
      email:
        recipients:
          - misanreacts@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment after configuring App Store Connect integration in Codemagic UI.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   beta_groups:
      #     - Internal Testers
