name: ministry_mobile
description: WOPP — The official app of Men and Women of Passion and Purpose.
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.1
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.1
  in_app_purchase_storekit: ^0.4.10
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  socket_io_client: ^3.1.5
  video_player: ^2.11.1
  pdfx: ^2.8.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_icon.png
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: assets/images/logo_icon.png
  remove_alpha_ios: true

flutter:
  # Flutter 3.44 enables SwiftPM by default; keep CocoaPods as the sole iOS
  # dependency manager to avoid ephemeral SPM symlink PathExistsException crashes.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/logo.png
