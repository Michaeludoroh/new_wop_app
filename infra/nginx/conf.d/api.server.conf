# API hostname — https://api.woppandmopp.com
#
# Admin and other API clients call https://api.woppandmopp.com/api/v1.
# This host MUST proxy to the Nest API (Compose service `api:4000`).
# It MUST NOT redirect to woppandmopp.com (that sent HTTPS traffic to the
# default TLS vhost — admin-web / Next.js — and produced a website 404).
#
# Shared Let's Encrypt cert covers api.woppandmopp.com
# (see admin.server.conf). Upstream is $ministry_api_upstream (api:4000).

server {
  listen 80;
  listen [::]:80;
  server_name api.woppandmopp.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.woppandmopp.com;

  ssl_certificate     /etc/letsencrypt/live/woppandmopp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/woppandmopp.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 100m;

  location ^~ /api/v1/uploads/ {
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location ~* ^/api/v1/[^/]+/admin/upload/ {
    client_max_body_size 512m;
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /api/ {
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }
}
