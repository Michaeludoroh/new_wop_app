# Production apex — woppandmopp.com / www.woppandmopp.com
#
# Canonical production URLs:
#   Website (Flask):     https://woppandmopp.com/
#   Website login:       https://woppandmopp.com/login
#   User password reset: https://woppandmopp.com/reset-password  (Nest, not Flask/admin)
#   Website admin:       https://woppandmopp.com/admin
#   Nest API:            https://woppandmopp.com/api/v1
#   WebSocket:           Engine.IO path /socket.io (namespace /realtime)
#                        https://woppandmopp.com/socket.io/ …
#   App admin (Next.js): https://admin.woppandmopp.com  (see admin.server.conf)
#
# Upstreams:
#   Flask:     172.18.0.1:8000
#   Nest API:  $ministry_api_upstream (api:4000)
#   WebSocket: $ministry_websocket_upstream (websocket:4100)

server {
  listen 80;
  listen [::]:80;
  server_name woppandmopp.com www.woppandmopp.com;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 100m;

  location ^~ /api/v1/uploads/ {
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location ~* ^/api/v1/[^/]+/admin/upload/ {
    client_max_body_size 512m;
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /api/ {
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  # Socket.IO clients use Engine.IO path /socket.io (default) + namespace /realtime.
  location /socket.io {
    proxy_pass http://$ministry_websocket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Kept for docs/legacy URL shape; Socket.IO handshake does not use this path.
  location /realtime {
    proxy_pass http://$ministry_websocket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Normal-user password reset page (Nest). Must not fall through to Flask or admin-web.
  location ^~ /reset-password {
    proxy_pass http://$ministry_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
  }

  location / {
    proxy_pass http://172.18.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }
}

